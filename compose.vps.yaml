services:
  backend:
    image: ghcr.io/hypothesis-lab/mono/backend:current
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      temporal:
        condition: service_started

  frontend:
    image: ghcr.io/hypothesis-lab/mono/frontend:current
    restart: unless-stopped
    ports:
      - "127.0.0.1:5175:80"

  generator:
    image: ghcr.io/hypothesis-lab/mono/generator:current
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.40
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    command: server -s3
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  temporal:
    image: docker.io/temporalio/auto-setup:1.29.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
