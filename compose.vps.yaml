services:
  backend:
    image: ghcr.io/hypothesis-lab/mono/backend:current
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      temporal:
        condition: service_healthy

  frontend:
    image: ghcr.io/hypothesis-lab/mono/frontend:current
    restart: unless-stopped
    ports:
      - "127.0.0.1:5175:80"

  generator:
    image: ghcr.io/hypothesis-lab/mono/generator:current
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.40
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    command: server -s3
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  temporal-admin-tools:
    image: docker.io/temporalio/admin-tools:1.32.0
    restart: on-failure:6
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    volumes:
      - ./temporal/setup-postgres.sh:/scripts/setup-postgres.sh:ro
      - temporal-setup:/setup

  temporal:
    image: docker.io/temporalio/server:1.32.0
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production.yaml
    entrypoint: ["/bin/sh"]
    command: /scripts/start-server.sh
    volumes:
      - ./temporal/dynamicconfig/production.yaml:/etc/temporal/config/dynamicconfig/production.yaml:ro
      - ./temporal/start-server.sh:/scripts/start-server.sh:ro
      - temporal-setup:/setup
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  temporal-create-namespace:
    image: docker.io/temporalio/admin-tools:1.32.0
    restart: on-failure:5
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    volumes:
      - ./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro

volumes:
  postgres-data:
  seaweedfs-data:
  temporal-setup:
