version: "3"

tasks:
  lint:
    cmds:
      - uv run ruff check app prototypes
      - uv run pyright app prototypes
      - uv run deptry . prototypes
      - uv run flake8 app prototypes --select CLB100
  format:
    cmds:
      - uv run ruff format app migrations prototypes
  security:
    cmds:
      - uv audit --locked
