[project]
name = "generator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi",
    "httpx",
    "psycopg[binary]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "flake8-clean-block>=0.1.2",
    "pyright>=1.1.414",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["collab"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
exclude = ["collab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
