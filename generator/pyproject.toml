[project]
name = "generator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi",
    "pydantic",
    "psycopg[binary]",
    "sqlalchemy",
    "uvicorn[standard]",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain-openai>=1.6.6",
    "prometheus-client>=0.26.0",
    "langchain-core>=1.6.4",
]

[dependency-groups]
dev = [
    "deptry",
    "flake8-clean-block>=0.1.2",
    "pyright>=1.1.414",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["collab"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
exclude = ["collab"]

[tool.deptry]
extend_exclude = ["collab"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RET", "ASYNC", "DTZ", "S"]
