openapi: "3.0.3"
info:
  title: API
  version: "1.0.0"
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
  /api/v1/auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          description: invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "409":
          description: email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Log in an existing user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserRequest"
      responses:
        "200":
          description: authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          description: invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "401":
          description: invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/yandex-direct/connection:
    get:
      operationId: getYandexDirectConnection
      tags: [yandex-direct]
      summary: Get the current user's Yandex Direct connection status
      responses:
        "200":
          description: Yandex Direct connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YandexDirectConnectionResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
    post:
      operationId: connectYandexDirect
      tags: [yandex-direct]
      summary: Exchange a Yandex confirmation code and connect Yandex Direct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YandexDirectConnectRequest"
      responses:
        "200":
          description: Yandex Direct connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YandexDirectConnectionResponse"
        "400":
          description: invalid or expired confirmation code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
    delete:
      operationId: disconnectYandexDirect
      tags: [yandex-direct]
      summary: Disconnect Yandex Direct and remove stored tokens
      responses:
        "204":
          description: Yandex Direct disconnected
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/yandex-direct/authorization-url:
    get:
      operationId: getYandexDirectAuthorizationURL
      tags: [yandex-direct]
      summary: Get the Yandex confirmation-code authorization URL
      responses:
        "200":
          description: Yandex authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YandexDirectAuthorizationURLResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/testing/product-feedback-survey:
    post:
      operationId: runProductFeedbackSurvey
      tags: [testing]
      summary: Run the product feedback survey for every persona
      security: []
      responses:
        "200":
          description: product feedback survey batch completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFeedbackSurveyRunResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/testing/product-feedback-survey/results:
    get:
      operationId: listProductFeedbackSurveyResults
      tags: [testing]
      summary: List stored product feedback survey results
      security: []
      responses:
        "200":
          description: stored product feedback survey results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFeedbackSurveyResultsResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/hypothesis:
    get:
      operationId: listHypotheses
      tags: [hypothesis]
      summary: List hypotheses
      responses:
        "200":
          description: list of hypotheses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HypothesisResponse"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
    post:
      operationId: createHypothesis
      tags: [hypothesis]
      summary: Create hypothesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHypothesisRequest"
      responses:
        "201":
          description: created hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisResponse"
        "400":
          description: invalid request body or description is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/hypothesis/{id}:
    get:
      operationId: getHypothesis
      tags: [hypothesis]
      summary: Get hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisResponse"
        "404":
          description: hypothesis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
    patch:
      operationId: updateHypothesis
      tags: [hypothesis]
      summary: Update hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHypothesisRequest"
      responses:
        "200":
          description: updated hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisResponse"
        "400":
          description: invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "404":
          description: hypothesis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
    delete:
      operationId: deleteHypothesis
      tags: [hypothesis]
      summary: Delete hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: hypothesis deleted
        "400":
          description: hypothesis in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "404":
          description: hypothesis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/hypothesis/{id}/launch:
    post:
      operationId: launchHypothesis
      tags: [hypothesis]
      summary: Launch hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: hypothesis launch queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisLaunchResponse"
        "400":
          description: hypothesis already in progress, has no product, or has no generated audiences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "404":
          description: hypothesis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "409":
          description: Yandex Direct connection is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/hypothesis/{id}/launch-status:
    get:
      operationId: getHypothesisLaunchStatus
      tags: [hypothesis]
      summary: Get hypothesis launch status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: hypothesis launch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisLaunchStatusResponse"
        "404":
          description: hypothesis or launch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/hypothesis/{id}/stop:
    post:
      operationId: stopHypothesis
      tags: [hypothesis]
      summary: Stop hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: hypothesis stop queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisStopResponse"
        "200":
          description: hypothesis is already stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisResponse"
        "409":
          description: Yandex Direct connection is not connected, or hypothesis launch or stop is in progress, or manual intervention is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "404":
          description: hypothesis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/hypothesis/{id}/product:
    get:
      operationId: getHypothesisProduct
      tags: [hypothesis]
      summary: Get the product attached to a hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: product attached to the hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: hypothesis not found, or no product attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/product:
    post:
      operationId: createProduct
      tags: [product]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: invalid request body or name is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "404":
          description: hypothesis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/product/{id}:
    patch:
      operationId: updateProduct
      tags: [product]
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "404":
          description: product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
    delete:
      operationId: deleteProduct
      tags: [product]
      summary: Delete product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: product deleted
        "404":
          description: product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/product/{id}/analysis:
    get:
      operationId: getProductAnalysis
      tags: [product]
      summary: Get the latest product analysis and generated hypotheses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: latest analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAnalysisResponse"
        "404":
          description: product or analysis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
    post:
      operationId: startProductAnalysis
      tags: [product]
      summary: Analyze the saved product, select an audience, and generate hypotheses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: analysis queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAnalysisResponse"
        "404":
          description: product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "409":
          description: analysis already running or segment dataset unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/product/{id}/analysis/review:
    put:
      operationId: saveProductAnalysisReview
      tags: [product]
      summary: Save user choices for a generated analysis stage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductAnalysisReviewRequest"
      responses:
        "200":
          description: saved stage review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAnalysisReviewResponse"
        "400":
          description: invalid stage review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "404":
          description: product or analysis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "409":
          description: stage is not awaiting user input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/product/{id}/analysis/continue:
    post:
      operationId: continueProductAnalysis
      tags: [product]
      summary: Continue an analysis after user review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: analysis resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAnalysisResponse"
        "404":
          description: product or analysis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "409":
          description: analysis is not waiting for user input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/hypothesis/{id}/files:
    get:
      operationId: listProductFiles
      tags: [file]
      summary: List product files attached to a hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: list of product files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductFileResponse"
        "404":
          description: hypothesis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
    post:
      operationId: uploadProductFile
      tags: [file]
      summary: Upload a product file attached to a hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload. Only .docx, .doc, .pdf, .txt, and .md files are accepted.
                type:
                  type: string
                  enum: [product, brandbook, reference, other]
      responses:
        "201":
          description: uploaded product file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFileResponse"
        "400":
          description: invalid request body, missing file, or unsupported file format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "404":
          description: hypothesis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "409":
          description: brandbook already exists for this hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "413":
          description: file exceeds size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/files/{id}:
    delete:
      operationId: deleteProductFile
      tags: [file]
      summary: Delete a product file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: product file deleted
        "404":
          description: product file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
  /api/v1/personas/query:
    post:
      operationId: queryPersonas
      tags: [personas]
      summary: Query the public persona dataset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaQueryRequest"
      responses:
        "200":
          description: matching personas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaQueryResponse"
        "400":
          description: invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "500":
          description: internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
        "503":
          description: persona dataset unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBody"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HypothesisResponse:
      type: object
      required: [id, description, status, created_at]
      properties:
        id:          { type: string }
        description: { type: string }
        status:      { type: string }
        created_at:  { type: string, format: date-time }
    HypothesisLaunchResponse:
      type: object
      required: [workflow_id, status]
      properties:
        workflow_id: { type: string }
        status: { type: string, enum: [queued] }
    ProductFeedbackSurveyRunResponse:
      type: object
      required: [count, questionnaire]
      properties:
        count: { type: integer }
        questionnaire:
          $ref: "#/components/schemas/ProductFeedbackSurveyQuestionnaire"
    ProductFeedbackSurveyQuestionnaire:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/ProductFeedbackSurveyQuestion"
    ProductFeedbackSurveyQuestion:
      type: object
      required: [type, instructions]
      properties:
        type: { type: string }
        instructions: { type: string }
        criteria: {}
    ProductFeedbackSurveyResultsResponse:
      type: object
      required: [questionnaire, results]
      properties:
        questionnaire:
          $ref: "#/components/schemas/ProductFeedbackSurveyQuestionnaire"
        results:
          type: array
          items:
            $ref: "#/components/schemas/ProductFeedbackSurveyResultResponse"
    ProductFeedbackSurveyResultResponse:
      type: object
      required: [persona_id, persona_name, persona, response]
      properties:
        persona_id: { type: string }
        persona_name: { type: string }
        persona:
          $ref: "#/components/schemas/ProductFeedbackSurveyPersona"
        response: {}
    ProductFeedbackSurveyPersona:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string }
        version: { type: string }
        source: { type: string }
        display_name: { type: string }
        dimensions:
          type: object
          additionalProperties: { type: string }
    HypothesisLaunchStatusResponse:
      type: object
      required: [workflow_id, status]
      properties:
        workflow_id: { type: string }
        status:
          type: string
          enum: [queued, running, completed, failed, canceled, timed_out, terminated]
    HypothesisStopResponse:
      type: object
      required: [workflow_id, status]
      properties:
        workflow_id: { type: string }
        status: { type: string, enum: [queued] }
    CreateHypothesisRequest:
      type: object
      required: [description]
      properties:
        description: { type: string, maxLength: 1024 }
    UpdateHypothesisRequest:
      type: object
      properties:
        description: { type: string, maxLength: 1024, nullable: true }
    ProductResponse:
      type: object
      required: [id, name, description, category, brand, country, experiment_goal, goal_origin, target_action, primary_metric, metric_direction, metric_numerator, metric_denominator, price, allowed_channels, forbidden_claims, known_constraints, unknowns, hypothesis_id, keywords]
      properties:
        id:            { type: string }
        name:          { type: string }
        description:   { type: string, minLength: 1 }
        category:      { $ref: "#/components/schemas/ProductCategory" }
