version: "3"

tasks:
  lint:
    cmds:
      - >-
        bash -o pipefail -c "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./... 2>&1 | sed '/^go: downloading /d'"

  vulncheck:
    cmds:
      - >-
        bash -o pipefail -c "go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... 2>&1 | sed '/^go: downloading /d'"

  test:unit:
    cmds:
      - go test $(go list ./... | grep -v '^app/test') -count=1 -v

  test:integration:
    cmds:
      - >-
        bash -o pipefail -c "DOCKER_HOST=unix://$(podman info --format '{{"{{"}}.Host.RemoteSocket.Path{{"}}"}}') go test ./test/... -count=1 -v 2>&1 | sed '/^go: downloading /d'"

  test:
    cmds:
      - task: test:unit
      - task: test:integration

  check:
    cmds:
      - task: lint
      - task: vulncheck
      - task: test

  gen:
    cmds:
      - >-
        bash -o pipefail -c "go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@c5590db43374a95d850bc78848bb34379e0153d7 --config internal/api/cfg.yaml internal/api/spec.yaml 2>&1 | sed '/^go: downloading /d'"
