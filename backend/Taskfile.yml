version: "3"

tasks:
  lint:
    cmds:
      - >-
        bash -o pipefail -c "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --timeout=5m ./... 2>&1 | sed '/^go: downloading /d'"

  vulncheck:
    cmds:
      - >-
        bash -o pipefail -c "GOMAXPROCS=2 GOMEMLIMIT=3GiB go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -scan=package ./... 2>&1 | sed '/^go: downloading /d'"

  workflowcheck:
    cmds:
      - >-
        bash -o pipefail -c 'tool_dir="$(go env GOBIN)"; if [ -z "$tool_dir" ]; then tool_dir="$(go env GOPATH)/bin"; fi; go install go.temporal.io/sdk/contrib/tools/workflowcheck@latest && "$tool_dir/workflowcheck" ./... 2>&1 | sed "/^go: downloading /d"'
      - >-
        bash -o pipefail -c 'tool_dir="$(go env GOBIN)"; if [ -z "$tool_dir" ]; then tool_dir="$(go env GOPATH)/bin"; fi; output="$("$tool_dir/workflowcheck" -workflow-debug ./internal/services 2>&1)" && [[ "$output" == *"workflowcheck: Checking workflow function app/internal/services.hypothesisLaunchWorkflow"* ]] && [[ "$output" == *"workflowcheck: Checking workflow function app/internal/services.hypothesisStopWorkflow"* ]]'

  test:unit:
    cmds:
      - go test $(go list ./... | grep -v '^app/test') -count=1 -v

  test:integration:
    cmds:
      - >-
        bash -o pipefail -c "DOCKER_HOST=unix://$(podman info --format '{{"{{"}}.Host.RemoteSocket.Path{{"}}"}}') go test ./test/... -count=1 -v 2>&1 | sed '/^go: downloading /d'"

  test:
    cmds:
      - task: test:unit
      - task: test:integration

  check:
    cmds:
      - task: lint
      - task: workflowcheck
      - task: vulncheck
      - task: test

  gen:
    cmds:
      - >-
        bash -o pipefail -c "go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@c5590db43374a95d850bc78848bb34379e0153d7 --config internal/api/cfg.yaml internal/api/spec.yaml 2>&1 | sed '/^go: downloading /d'"
