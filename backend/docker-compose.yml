services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgres://postgres:postgres@postgres:5433/app?sslmode=disable
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_REGION=us-east-1
      - S3_BUCKET=my-bucket
      - S3_ACCESS_KEY_ID=admin
      - S3_SECRET_ACCESS_KEY=secret
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    ports:
      - "8333:8333"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=secret
      - S3_BUCKET=my-bucket
    command: "server -s3"
    restart: unless-stopped
