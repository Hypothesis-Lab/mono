services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5175:80"
      - "10.8.0.4:8080:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
      JWT_SECRET: 7744c2b280979ec898753a45769926de9408a3472ba566521ee7f798714fd0e5
      YANDEX_DIRECT_TOKEN_ENCRYPTION_KEY: ${YANDEX_DIRECT_TOKEN_ENCRYPTION_KEY}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: my-bucket
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: secret
      GENERATOR_URL: http://generator:8000
      TEMPORAL_ADDRESS: temporal:7233
      DEV_LOGGER: "true"
      WRITE_TIMEOUT: 5m
    volumes:
      - ./backend/datasets/personas-1m:/app/datasets/personas-1m:ro
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      generator:
        condition: service_healthy
      temporal:
        condition: service_healthy

  temporal-admin-tools:
    image: docker.io/temporalio/admin-tools:1.32.0
    restart: on-failure:6
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: postgres
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    volumes:
      - ./temporal/setup-postgres.sh:/scripts/setup-postgres.sh:ro
      - temporal-setup:/setup

  temporal:
    image: docker.io/temporalio/server:1.32.0
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production.yaml
    ports:
      - "127.0.0.1:7233:7233"
    entrypoint: ["/bin/sh"]
    command: /scripts/start-server.sh
    volumes:
      - ./temporal/dynamicconfig/production.yaml:/etc/temporal/config/dynamicconfig/production.yaml:ro
      - ./temporal/start-server.sh:/scripts/start-server.sh:ro
      - temporal-setup:/setup
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  temporal-create-namespace:
    image: docker.io/temporalio/admin-tools:1.32.0
    restart: on-failure:5
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    volumes:
      - ./temporal/create-namespace.sh:/scripts/create-namespace.sh:ro

  temporal-ui:
    image: docker.io/temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      temporal:
        condition: service_started
  generator:
    build:
      context: ./generator
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
      HOST: 0.0.0.0
      PORT: "8000"
      WORKER_CONCURRENCY: "2"
      GRAPH_MAX_CONCURRENCY: "2"
      CODEX_PROXY_BASE_URL: http://codex-proxy:8080/v1
      CODEX_PROXY_KEY: ${CODEX_PROXY_KEY}
      CODEX_MAX_RETRIES: "2"
      CODEX_MODEL: gpt-5.6-luna
      CODEX_REASONING_EFFORT: low
      CODEX_TIMEOUT_SECONDS: "120"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - codex-proxy

  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.40
    ports:
      - "127.0.0.1:8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
    command: server -s3
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
  seaweedfs-data:
  temporal-setup:

networks:
  default: {}
  codex-proxy:
    external: true
    name: codex-proxy_default
