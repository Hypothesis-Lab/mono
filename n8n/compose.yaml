services:
  n8n:
    image: ghcr.io/n8n-io/n8n:${N8N_VERSION:-2.32.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /files;/product
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Moscow}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
      - ../agent-framework/product:/product:ro
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  n8n_data:
