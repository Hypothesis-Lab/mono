[project]
name = "tempo-eval"
version = "0.1.0"
description = "Run the Tempo product extraction workflow against OpenRouter models."
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastembed==0.9.0",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic",
]

[dependency-groups]
dev = [
    "ruff",
]
notebooks = [
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
